name: Build TWA AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Build AAB
        run: |
          mkdir -p ./.bubblewrap
          export BUBBLEWRAP_CONFIG_PATH="./.bubblewrap"
          yes | bubblewrap build \
            --keystore "./upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt \
            --accept_sdk_license
          find /home/runner -name "*.aab" 2>/dev/null
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          path: |
            ./app-release-bundle.aab
            /home/runner/work/kkl2026/kkl2026/app-release-bundle.aab
