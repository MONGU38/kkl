name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone TWA Quickstart
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa-build

      - name: Configure TWA
        run: |
          cd twa-build
          sed -i 's|https://svgomg.firebaseapp.com|https://mongu38.github.io/kkl2026|g' app/build.gradle
          sed -i 's|svgomg.firebaseapp.com|mongu38.github.io|g' app/build.gradle
          sed -i 's|com.chromestatus.svgomg|com.appwild.kkl2026|g' app/build.gradle

      - name: Build AAB
        run: |
          cd twa-build
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          path: twa-build/app/build/outputs/bundle/release/app-release.aab
