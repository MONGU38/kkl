name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create TWA project
        run: |
          mkdir twa-build
          cd twa-build
          bubblewrap init --manifest https://mongu38.github.io/kkl2026/manifest.json --skipPwaValidation --jdkPath $JAVA_HOME --androidSdkPath $ANDROID_SDK_ROOT
        env:
          BUBBLEWRAP_ACCEPT_SYSTEM_TOOLS: true
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin_jdk/17.0.14-7/x64

      - name: Build AAB
        run: |
          cd twa-build
          bubblewrap build --skipSigning
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin_jdk/17.0.14-7/x64

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          path: twa-build/app-release-unsigned.aab
