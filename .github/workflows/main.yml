name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          # 1. 설정 폴더 생성 및 환경 변수 고정
          mkdir -p ./.bubblewrap
          export BUBBLEWRAP_CONFIG_PATH="./.bubblewrap"
          
          # 2. 파일 복사 및 위치 확인
          cp twa-manifest.json ./twa-manifest.json
          
          # 3. 질문 없이 빌드 실행 (경로 문제 해결을 위해 내부 옵션 집중 사용)
          bubblewrap build \
            --keystore "./upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt \
            --accept_sdk_license

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          # 파일이 어디에 생성되든 모두 찾아내도록 경로를 광범위하게 지정했습니다.
          path: |
            ./*.aab
            ./**/*.aab
            /home/runner/work/kkl2026/kkl2026/*.aab
          if-no-files-found: error
