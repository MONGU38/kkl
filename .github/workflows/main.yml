name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          # 아까 성공했던 그 경로 설정입니다.
          mkdir -p $HOME/.bubblewrap
          cp twa-manifest.json $HOME/twa-manifest.json
          
          cd $HOME
          # 무한 'y'로 문을 열었던 바로 그 명령어입니다.
          yes | bubblewrap build \
            --keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          # 아까 파일을 못 찾았던 지점을 해결하기 위해
          # 경로를 더 포괄적으로 잡았습니다.
          path: |
            /home/runner/*.aab
            /home/runner/work/kkl2026/kkl2026/*.aab
          if-no-files-found: error
