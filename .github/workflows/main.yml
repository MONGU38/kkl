name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          # 1. 버블랩 설정 폴더 강제 생성 및 환경 변수 고정
          mkdir -p ./.bubblewrap
          export BUBBLEWRAP_CONFIG_PATH="./.bubblewrap"
          
          # 2. 질문 원천 봉쇄 (내부 옵션 사용)
          bubblewrap build \
            --keystore "./upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt \
            --accept_sdk_license || echo "빌드 중 오류 발생"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          path: |
            ./app-release-bundle.aab
            /home/runner/work/kkl2026/kkl2026/app-release-bundle.aab
