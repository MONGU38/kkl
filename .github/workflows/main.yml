name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          # 1. 설정 폴더 미리 생성
          mkdir -p $HOME/.bubblewrap
          
          # 2. 매니페스트 복사
          cp twa-manifest.json $HOME/twa-manifest.json
          
          # 3. 질문 차단 옵션과 함께 빌드 실행
          cd $HOME
          echo "y" | bubblewrap build \
            --keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          path: /home/runner/app-release-bundle.aab
