name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          mkdir -p $HOME/.bubblewrap
          cp twa-manifest.json $HOME/twa-manifest.json
          
          cd $HOME
          echo "y" | bubblewrap build \
            --keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt

      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: kkl2026-aab
          path: $HOME/app-release-bundle.aab
