name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          mkdir -p $HOME/.bubblewrap
          cp twa-manifest.json $HOME/twa-manifest.json
          
          cd $HOME
          # YES를 무한히 보내서 모든 라이선스 및 JDK 설치 질문을 통과시킵니다.
          yes | bubblewrap build \
            --keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          path: /home/runner/app-release-bundle.aab
