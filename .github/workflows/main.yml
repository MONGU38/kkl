name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        run: |
          mkdir -p $HOME/.bubblewrap
          cp twa-manifest.json $HOME/twa-manifest.json
          
          cd $HOME
          yes | bubblewrap build \
            --keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyAlias upload \
            --keyPassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --skipConfig \
            --no-prompt
          
          # [수정] 파일이 어디 있든 강제로 찾아내서 작업 폴더로 옮깁니다.
          find /home/runner -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/ \;

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kkl2026-aab
          # 작업 공간에 있는 모든 .aab 파일을 다 긁어모읍니다.
          path: "*.aab"
          if-no-files-found: error
